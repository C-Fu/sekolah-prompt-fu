<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" shape-rendering="crispEdges" style="image-rendering: pixelated;">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="30%" stop-color="#87CEEB"/>
      <stop offset="60%" stop-color="#98D8F0"/>
      <stop offset="100%" stop-color="#B8E8F8"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect x="0" y="0" width="20" height="20" rx="4" ry="4"/>
    </clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect x="0" y="0" width="20" height="20" fill="url(#sky)"/>
    <!-- Antenna -->
    <rect x="9" y="3" width="2" height="2" fill="#FFD700"/>
    <rect x="8" y="5" width="4" height="1" fill="#C0C0C0"/>
    <!-- Head -->
    <rect x="4" y="6" width="12" height="8" fill="#4A90D9"/>
    <!-- Eyes -->
    <rect x="6" y="8" width="3" height="3" fill="#FFFFFF"/>
    <rect x="11" y="8" width="3" height="3" fill="#FFFFFF"/>
    <rect x="7" y="9" width="2" height="2" fill="#333333"/>
    <rect x="12" y="9" width="2" height="2" fill="#333333"/>
    <!-- Smile -->
    <rect x="8" y="12" width="4" height="1" fill="#333333"/>
    <rect x="7" y="11" width="1" height="1" fill="#333333"/>
    <rect x="12" y="11" width="1" height="1" fill="#333333"/>
  </g>
</svg>
